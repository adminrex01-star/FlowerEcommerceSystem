<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>注册 - 网上花店</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #B9DA90 0%, #764ba2 100%); min-height:100vh; display:flex; justify-content:center; align-items:center; }
        .register-container { background:white; border-radius:10px; padding:40px; width:450px; box-shadow:0 15px 35px rgba(0,0,0,0.2); }
        h2 { text-align:center; color:#333; margin-bottom:30px; }
        .form-group { margin-bottom:15px; }
        label { display:block; margin-bottom:5px; color:#666; }
        input, select { width:100%; padding:10px; border:1px solid #ddd; border-radius:5px; font-size:16px; }
        button { width:100%; padding:12px; background:#B9DA90; color:white; border:none; border-radius:5px; font-size:16px; cursor:pointer; }
        .error { color:#a5c87d; margin-bottom:15px; text-align:center; }
        .link { text-align:center; margin-top:20px; }
    </style>
</head>
<body>
<div class="register-container">
    <h2>用户注册</h2>
    <div th:if="${error}" class="error" th:text="${error}"></div>
    <form th:action="@{/register}" method="post">
        <div class="form-group"><label>用户名</label><input type="text" name="username" required></div>
        <div class="form-group"><label>密码</label><input type="password" name="password" required></div>
        <div class="form-group"><label>真实姓名</label><input type="text" name="realName"></div>
        <div class="form-group"><label>手机号</label><input type="text" name="phone"></div>
        <div class="form-group"><label>邮箱</label><input type="email" name="email"></div>
        <button type="submit">注册</button>
    </form>
    <div class="link"><a th:href="@{/login}">已有账号？去登录</a></div>
</div>
</body>
</html>
