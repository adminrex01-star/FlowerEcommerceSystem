<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>订单详情</title><style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Microsoft YaHei';background:#f5f5f5;}
    .container{max-width:800px;margin:20px auto;background:white;border-radius:10px;padding:20px;}
    .info{margin:20px 0;padding:15px;background:#f8f8f8;border-radius:8px;}
    table{width:100%;border-collapse:collapse;}
    th,td{padding:10px;border-bottom:1px solid #eee;text-align:left;}
    .btn{margin-top:20px;display:inline-block;padding:10px 20px;background:#B9DA90;color:white;text-decoration:none;border-radius:5px;}
</style></head>
<body>
<div class="container">
    <h2>订单详情</h2>
    <div class="info">
        <p>订单号：<span th:text="${order.orderId}"></span></p>
        <p>下单时间：<span th:text="${#dates.format(order.createTime, 'yyyy-MM-dd HH:mm:ss')}"></span></p>
        <p>订单状态：<span th:text="${order.orderStatus}"></span></p>
        <p>收货人：<span th:text="${order.receiver}"></span> / <span th:text="${order.phone}"></span></p>
        <p>收货地址：<span th:text="${order.address}"></span></p>
    </div>
    <h3>商品清单</h3>
    <table>
        <tr><th>商品</th><th>单价</th><th>数量</th><th>小计</th></tr>
        <tr th:each="item : ${order.items}">
            <td th:text="${item.productName}"></td>
            <td th:text="'¥' + ${item.price}"></td>
            <td th:text="${item.num}"></td>
            <td th:text="'¥' + ${item.price * item.num}"></td>
        </tr>
        <tr><td colspan="3" style="text-align:right;">总计：</td><td th:text="'¥' + ${order.totalPrice}"></td></tr>
    </table>
    <a th:href="@{/orders}" class="btn">返回订单列表</a>
</div>
</body>
</html>
