<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>个人中心</title><style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Microsoft YaHei';background:#f5f5f5;}
    .container{max-width:600px;margin:30px auto;background:white;border-radius:10px;padding:30px;}
    .form-group{margin-bottom:20px;}
    label{display:block;margin-bottom:5px;color:#666;}
    input{width:100%;padding:10px;border:1px solid #ddd;border-radius:5px;}
    .btn{padding:10px 20px;background:#B9DA90;color:white;border:none;border-radius:5px;cursor:pointer;}
    .message{color:#B9DA90;margin-bottom:10px;}
    .error{color:#a5c87d;margin-bottom:10px;}
    hr{margin:20px 0;}
</style></head>
<body>
<div class="container">
    <h2>个人资料</h2>
    <div th:if="${message}" class="message" th:text="${message}"></div>
    <div th:if="${error}" class="error" th:text="${error}"></div>
    <form th:action="@{/profile/update}" method="post">
        <div class="form-group"><label>真实姓名</label><input type="text" name="realName" th:value="${user.realName}"></div>
        <div class="form-group"><label>手机号</label><input type="text" name="phone" th:value="${user.phone}"></div>
        <div class="form-group"><label>邮箱</label><input type="email" name="email" th:value="${user.email}"></div>
        <button type="submit" class="btn">保存修改</button>
    </form>
    <hr>
    <h3>修改密码</h3>
    <div th:if="${pwdError}" class="error" th:text="${pwdError}"></div>
    <form th:action="@{/profile/password}" method="post">
        <div class="form-group"><label>原密码</label><input type="password" name="oldPassword" required></div>
        <div class="form-group"><label>新密码</label><input type="password" name="newPassword" required></div>
        <button type="submit" class="btn">修改密码</button>
    </form>
</div>
<div style="margin-bottom: 20px;">
    <a th:href="@{/}" class="btn btn-secondary">返回首页</a>
</div>
</body>
</html>
