<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>确认订单</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Microsoft YaHei';background:#f5f5f5;}
        .container{max-width:800px;margin:30px auto;background:white;border-radius:10px;padding:30px;}
        .form-group{margin-bottom:20px;}
        label{display:block;margin-bottom:5px;}
        input{width:100%;padding:10px;border:1px solid #ddd;border-radius:5px;}
        .btn{padding:12px;background:#B9DA90;color:white;border:none;border-radius:5px;cursor:pointer;width:100%;}
    </style>
</head>
<body>
<div class="container">
    <h2>确认订单信息</h2>
    <form th:action="@{/order/submit}" method="post">
        <div class="form-group"><label>收货人</label><input type="text" name="receiver" th:value="${user.realName}" required></div>
        <div class="form-group"><label>手机号</label><input type="text" name="phone" th:value="${user.phone}" required></div>
        <div class="form-group"><label>收货地址</label><input type="text" name="address" required></div>
        <!-- 需要将选中的购物车ID传递下去，这里可以通过隐藏域 -->
        <div th:each="c : ${selectedCarts}">
            <input type="hidden" name="cartIds" th:value="${c.cartId}">
        </div>
        <button type="submit" class="btn">提交订单</button>
    </form>
</div>
</body>
</html>
