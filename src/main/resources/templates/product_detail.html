<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>商品详情</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Microsoft YaHei';background:#f5f5f5;}
        .container{max-width:1200px;margin:0 auto;padding:20px;background:white;border-radius:10px;}
        .detail{display:flex;gap:30px;padding:30px;}
        .img{width:400px;height:400px;background:#f0f0f0;display:flex;align-items:center;justify-content:center;font-size:80px;border-radius:10px;}
        .info{flex:1;}
        .name{font-size:28px;font-weight:bold;margin-bottom:20px;}
        .price{font-size:32px;color:#a5c87d;margin:20px 0;}
        .stock{color:#666;margin:10px 0;}
        .btn{padding:12px 30px;background:#B9DA90;color:white;border:none;border-radius:5px;cursor:pointer;font-size:16px;text-decoration:none;display:inline-block;}
        .back{margin-top:20px;display:inline-block;color:#999;}
    </style>
</head>
<body>
<div class="container">
    <div class="detail">
        <div class="img">
            <img th:src="@{${product.pic}}" alt="商品图片" style="width:100%; height:100%; object-fit:cover;">
        </div>
        <div class="info">
            <div class="name" th:text="${product.productName}"></div>
            <div class="price" th:text="'¥' + ${product.price}"></div>
            <div class="stock" th:text="'库存：' + ${product.stock} + '件'"></div>
            <div class="desc" th:text="${product.content}"></div>
            <a th:href="@{/cart/add(productId=${product.productId})}" class="btn">加入购物车</a>
            <br><a th:href="@{/}" class="back">返回首页</a>
        </div>
    </div>
</div>
</body>
</html>
