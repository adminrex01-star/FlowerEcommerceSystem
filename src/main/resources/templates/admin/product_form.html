<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>商品编辑</title><style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Microsoft YaHei';background:#f5f5f5;}
    .container{max-width:600px;margin:30px auto;background: #486441;border-radius:10px;padding:30px;}
    .form-group{margin-bottom:15px;}
    label{display:block;margin-bottom:5px;}
    input,select,textarea{width:100%;padding:8px;border:1px solid #ddd;border-radius:4px;}
    .btn{padding:10px 20px;background: #fde5e5;color:white;border:none;border-radius:5px;cursor:pointer;}
</style></head>
<body>
<div class="container">
    <h2 th:if="${product == null}">新增商品</h2>
    <h2 th:if="${product != null}">编辑商品</h2>
    <form th:action="@{/admin/product/save}" method="post">
        <input type="hidden" name="productId" th:value="${product.productId}">
        <div class="form-group"><label>商品名称</label><input type="text" name="productName" th:value="${product.productName}" required></div>
        <div class="form-group"><label>分类</label>
            <select name="categoryId">
                <option th:each="c : ${categories}" th:value="${c.categoryId}" th:text="${c.categoryName}" th:selected="${c.categoryId == product.categoryId}"></option>
            </select>
        </div>
        <div class="form-group"><label>价格</label><input type="number" step="0.01" name="price" th:value="${product.price}" required></div>
        <div class="form-group"><label>库存</label><input type="number" name="stock" th:value="${product.stock}" required></div>
        <div class="form-group"><label>图片URL</label><input type="text" name="pic" th:value="${product.pic}"></div>
        <div class="form-group"><label>描述</label><textarea name="content" rows="3" th:text="${product.content}"></textarea></div>
        <div class="form-group"><label>状态</label>
            <select name="status">
                <option value="1" th:selected="${product.status == 1}">上架</option>
                <option value="0" th:selected="${product.status == 0}">下架</option>
            </select>
        </div>
        <button type="submit" class="btn">保存</button>
        <a th:href="@{/admin/products}" class="btn" style="background:#999;">返回</a>
    </form>
</div>
</body>
</html>
