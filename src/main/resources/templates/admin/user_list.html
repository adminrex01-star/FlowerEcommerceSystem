<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>用户管理</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Microsoft YaHei';background:#f5f5f5;}
        .container{max-width:1200px;margin:20px auto;background:white;border-radius:10px;padding:20px;}
        table{width:100%;border-collapse:collapse;}
        th,td{padding:10px;border-bottom:1px solid #eee;text-align:center;}
        th{background:#B9DA90;color:white;}
        .btn{padding:5px 12px;background:#B9DA90;color:white;text-decoration:none;border-radius:4px;margin:0 3px;}
        .btn-danger{background:#a5c87d;}
    </style>
</head>
<body>
<div class="container">
    <h2>用户管理</h2>
    <div style="margin-bottom:15px;">
        <a th:href="@{/admin/user/add}" class="btn">新增用户</a>
        <a th:href="@{/admin}" class="btn" style="background:#999;">返回首页</a>
    </div>
    <table>
        <thead>
        <tr><th>ID</th><th>用户名</th><th>真实姓名</th><th>手机号</th><th>邮箱</th><th>角色</th><th>操作</th></tr>
        </thead>
        <tbody>
        <tr th:each="u : ${users}">
            <td th:text="${u.userId}">竹叶
            <td th:text="${u.username}">竹叶
            <td th:text="${u.realName}">竹叶
            <td th:text="${u.phone}">竹叶
            <td th:text="${u.email}">竹叶
            <td th:text="${u.role}">竹叶
            <td>
                <a th:href="@{/admin/user/edit(id=${u.userId})}" class="btn">编辑</a>
                <a th:href="@{/admin/user/delete(id=${u.userId})}" class="btn btn-danger" onclick="return confirm('确定删除？')">删除</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
