<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>分类表单</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Microsoft YaHei';background:#f5f5f5;}
        .container{max-width:500px;margin:30px auto;background:white;border-radius:10px;padding:30px;}
        .form-group{margin-bottom:20px;}
        label{display:block;margin-bottom:5px;font-weight:bold;}
        input,textarea{width:100%;padding:8px;border:1px solid #ddd;border-radius:4px;}
        .btn{padding:10px 20px;background:#B9DA90;color:white;border:none;border-radius:4px;cursor:pointer;}
    </style>
</head>
<body>
<div class="container">
    <h2 th:if="${category.categoryId == null}">新增分类</h2>
    <h2 th:if="${category.categoryId != null}">编辑分类</h2>
    <form th:action="@{/admin/category/save}" method="post">
        <input type="hidden" name="categoryId" th:value="${category.categoryId}">
        <div class="form-group">
            <label>分类名称</label>
            <input type="text" name="categoryName" th:value="${category.categoryName}" required>
        </div>
        <div class="form-group">
            <label>描述</label>
            <textarea name="description" rows="3" th:text="${category.description}"></textarea>
        </div>
        <button type="submit" class="btn">保存</button>
        <a th:href="@{/admin/categories}" class="btn" style="background:#999; text-decoration:none;">返回</a>
    </form>
</div>
</body>
</html>
