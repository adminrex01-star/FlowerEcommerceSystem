<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>用户表单</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Microsoft YaHei';background:#f5f5f5;}
        .container{max-width:500px;margin:30px auto;background:white;border-radius:10px;padding:30px;}
        .form-group{margin-bottom:20px;}
        label{display:block;margin-bottom:5px;font-weight:bold;}
        input,select{width:100%;padding:8px;border:1px solid #ddd;border-radius:4px;}
        .btn{padding:10px 20px;background:#B9DA90;color:white;border:none;border-radius:4px;cursor:pointer;}
    </style>
</head>
<body>
<div class="container">
    <h2 th:if="${user.userId == null}">新增用户</h2>
    <h2 th:if="${user.userId != null}">编辑用户</h2>
    <form th:action="@{/admin/user/save}" method="post">
        <input type="hidden" name="userId" th:value="${user.userId}">
        <div class="form-group">
            <label>用户名</label>
            <input type="text" name="username" th:value="${user.username}" required th:readonly="${user.userId != null}">
        </div>
        <div class="form-group">
            <label>密码</label>
            <input type="password" name="password" th:value="${user.password}" required>
        </div>
        <div class="form-group">
            <label>真实姓名</label>
            <input type="text" name="realName" th:value="${user.realName}">
        </div>
        <div class="form-group">
            <label>手机号</label>
            <input type="text" name="phone" th:value="${user.phone}">
        </div>
        <div class="form-group">
            <label>邮箱</label>
            <input type="email" name="email" th:value="${user.email}">
        </div>
        <div class="form-group">
            <label>角色</label>
            <select name="role">
                <option value="user" th:selected="${user.role == 'user'}">普通用户</option>
                <option value="admin" th:selected="${user.role == 'admin'}">管理员</option>
            </select>
        </div>
        <button type="submit" class="btn">保存</button>
        <a th:href="@{/admin/users}" class="btn" style="background:#999; text-decoration:none;">返回</a>
    </form>
</div>
</body>
</html>
