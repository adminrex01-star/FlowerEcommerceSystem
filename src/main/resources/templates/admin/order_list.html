<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>订单管理</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Microsoft YaHei';background:#f5f5f5;}
        .container{max-width:1200px;margin:20px auto;background:white;border-radius:10px;padding:20px;}
        table{width:100%;border-collapse:collapse;}
        th,td{padding:10px;border-bottom:1px solid #eee;text-align:center;}
        th{background:#B9DA90;color:white;}
        .btn{padding:5px 10px;background:#B9DA90;color:white;text-decoration:none;border-radius:4px;font-size:12px;}
    </style>
</head>
<body>
<div class="container">
    <h2>订单管理</h2>
    <div style="margin-bottom:15px;">
        <a th:href="@{/admin}" class="btn" style="background:#999;">返回首页</a>
    </div>
    <table>
        <thead>
        <tr><th>订单号</th><th>用户</th><th>总金额</th><th>状态</th><th>操作</th></tr>
        </thead>
        <tbody>
        <tr th:each="o : ${page.list}">
            <td th:text="${o.orderId}">竹叶
            <td th:text="${o.username}">竹叶
            <td th:text="'¥' + ${o.totalPrice}">竹叶
            <td th:text="${o.orderStatus}">竹叶
            <td>
                <a th:href="@{/admin/order/updateStatus(orderId=${o.orderId},status='shipped')}" class="btn">发货</a>
                <a th:href="@{/admin/order/updateStatus(orderId=${o.orderId},status='completed')}" class="btn">完成</a>
                <a th:href="@{/admin/order/delete(orderId=${o.orderId})}" class="btn btn-danger" onclick="return confirm('确定删除？')">删除</a>
            </td>
        </tr>
        </tbody>
    </table>
    <!-- 分页代码略 -->
</div>
</body>
</html>
