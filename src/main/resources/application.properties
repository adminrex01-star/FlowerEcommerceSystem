# 服务端口
server.port=8080

# 数据源 (使用你给出的flower_shop数据库，账号密码自己填)
spring.datasource.url=jdbc:mysql://localhost:3306/onlineflowershop?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
spring.datasource.username=your_root
spring.datasource.password=your_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.flower.po
mybatis.configuration.map-underscore-to-camel-case=true

# Thymeleaf 缓存关闭（开发阶段）
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8

# PageHelper 配置
pagehelper.helper-dialect=mysql
pagehelper.reasonable=true
pagehelper.support-methods-arguments=true
#超时30min
properties
server.servlet.session.timeout=30m